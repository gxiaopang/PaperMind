limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
# Re-resolve Docker service addresses when an API container is recreated.
resolver 127.0.0.11 valid=5s ipv6=off;
upstream papermind_api {
    zone papermind_api 64k;
    server api:8000 resolve;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 101m;
    proxy_connect_timeout 5s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location ~ ^/assets/.*\.mjs$ {
        types { application/javascript mjs; }
        etag off;
        if_modified_since off;
        expires -1;
        try_files $uri =404;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location = /readyz {
        proxy_pass http://papermind_api;
        proxy_set_header Host $host;
        access_log off;
    }
    location /api/v1/auth/ {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://papermind_api;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        access_log off;
    }
    location /api/ {
        proxy_pass http://papermind_api;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
